services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: taskservice
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5400:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d taskservice"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./migrations/0001_create_tasks.up.sql:/docker-entrypoint-initdb.d/001_create_tasks.sql:ro
      - ./migrations/0002_create_task_recurrences.up.sql:/docker-entrypoint-initdb.d/002_create_task_recurrences.sql:ro

  app:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      HTTP_ADDR: :8089
      DATABASE_DSN: postgres://postgres:postgres@postgres:5432/taskservice?sslmode=disable
    
      #task generator settings
      GENERATOR_RECENT_INTERVAL_MINUTES: 5
      GENERATOR_RECENT_WINDOW_MINUTES: 10
      GENERATOR_RECENT_LOOKAHEAD_DAYS: 2
      GENERATOR_DAILY_LOOKAHEAD_DAYS: 7
      GENERATOR_DAILY_RUN_HOUR: 1
      GENERATOR_DAILY_RUN_MINUTE: 0
    ports:
      - "8089:8089"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data: